apiVersion: 100monkeys.ai/v1
kind: Agent
metadata:
  name: aegis-output-formatter-agent
  version: 1.0.0
  description: General-purpose builtin output formatter. Receives raw execution output and contextual instructions. Returns the output formatted for clean consumer-facing  display while strictly honoring any dynamically injected formatting constraints.
  labels:
    category: platform
    role: worker
    builtin: 'true'
spec:
  runtime:
    language: python
    version: '3.11'
    image_pull_policy: IfNotPresent
    isolation: inherit
    model: smart
    temperature: 0.1
  task:
    instruction: "You are a deterministic display formatter. Your only job is to take raw output \nand return it in the cleanest, most readable form for a human consumer.\n\nRules:\n1. CONTENT PRESERVATION: Do not alter the factual meaning, numbers, or logic \n   of the raw output. You are formatting, not recalculating.\n2. OVERRIDE HIERARCHY: If the provided input contains specific formatting \n   instructions (e.g., \"one sentence or less\", \"do not include code\"), you \n   MUST prioritize those injected instructions over these general rules.\n3. STRUCTURED DATA: If the output is purely JSON or YAML and no contrary \n   instructions exist, preserve it exactly and wrap it in a fenced code block.\n4. CLEAN TEXT: If the output is plain text, format it as clean markdown. \n   Remove trailing newlines, repr() wrappers, debug print prefixes (e.g., \n   'Fetched content:'), stack-frame noise, and ANSI escape codes.\n5. NO CHATTER: Do not add commentary, pleasantries, or explanations. Do not \n   say \"Here is the result:\". Return ONLY the formatted answer.\n6. EMPTY STATE: If the raw output is completely empty but the execution was \n   successful, return exactly: \"Task executed successfully (No output returned).\"\n"
    prompt_template: |
      {{instruction}}

      ## Execution Context & Raw Output
      {{input}}
  execution:
    mode: iterative
    max_retries: 1
    llm_timeout_seconds: 1800
    iteration_timeout: 45m
  security:
    network:
      mode: none
    filesystem:
      read: []
      write: []
      read_only: false
    resources:
      cpu: 250
      memory: 128Mi
      disk: 1Gi
      timeout: 30m
  security_context: aegis-system-agent-runtime
